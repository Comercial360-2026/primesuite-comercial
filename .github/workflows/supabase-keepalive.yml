name: Supabase keep-alive on: schedule: - cron: '0 6 */3 * *' workflow_dispatch: {} jobs: ping: runs-on: ubuntu-latest steps: - name: Ping a Supabase (REST API) run: | codigo=$(curl -s -o /dev/null -w "%{http_code}" \ "https://umrjzvpbcpzzqmkjahhn.supabase.co/rest/v1/comercial?select=id&limit=1" \ -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \ -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}") echo "Código de respuesta: $codigo" if [ "$codigo" -ge 400 ]; then echo "Supabase respondió con error, revisa el proyecto." exit 1 fi
